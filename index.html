<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<title>Inventario</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/styleModal.css">   
</head>
<body>

<h1>📦 Inventario</h1>

<div id="estadisticas">
    <div id="totalProductos"></div>
    <div id="totalExistencias"></div>
    <div id="ultimaExportacion">
🕒 Última exportación: NUNCA
</div>

</div>

<button
id="btnExportar"
onclick="exportarExcel()"
style="
width:100%;
margin-bottom:15px;
background:#4CAF50;
color:white;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
">
📥 EXPORTAR EXCEL
</button>

<button
onclick="document.getElementById('archivoExcel').click()"
style="
width:100%;
margin-bottom:15px;
background:#705328;
color:white;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
">
📂 IMPORTAR EXCEL
</button>

<input
type="file"
id="archivoExcel"
accept=".xlsx"
style="display:none;"
onchange="importarExcel(event)">

<input id="buscar" placeholder="Buscar producto">

<div id="formularioProducto">

    <input id="codigo" placeholder="Código de barras">

    <input id="nombre" placeholder="Nombre">

    <textarea id="descripcion" placeholder="Descripción"></textarea>

    <input id="cantidad" type="number" placeholder="Cantidad">

    <input id="area" placeholder="Área">

    <button class="guardar" onclick="guardarProducto()">
    💾 Guardar Producto
    </button>

    <button
    style="
    width:100%;
    margin-top:10px;
    background:#d32f2f;
    color:white;
    "
    onclick="reiniciarInventario()">
    🗑 Reiniciar Inventario
    </button>

    <button class="cancelar" onclick="cerrarFormulario()">
      🔙 Cancelar
    </button>


</div>

<div id="lista"></div>

<!-- JS -->
<script src="js/excel.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>



<button id="btnFlotante" onclick="abrirFormulario()">
+
</button>

<!-- MODAL -->

<div id="modalAlerta" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h3 id="tituloModal">
            Inventario
        </h3>

        <p id="textoModal"></p>

        <button
        onclick="cerrarModal()">
            Aceptar
        </button>

    </div>

</div>

<!-- FIN MODAL -->

<!-- MODAL HISTORIAL -->
 <div id="modalHistorial" class="modal-alerta">

    <div class="modal-alerta-contenido modal-historial">

        <h2 id="tituloHistorial">
            Historial
        </h2>

        <div id="contenidoHistorial">
        </div>

        <button onclick="cerrarHistorial()">
            Cerrar
        </button>

    </div>

</div>
<!-- FIN MODAL HISTORIAL -->

<!-- MODAL CONFIRMACION -->
 <div id="modalConfirmar" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2 id="tituloConfirmar">
            Confirmar
        </h2>

        <p id="textoConfirmar">
        </p>

        <div style="
        display:flex;
        gap:10px;
        justify-content:center;">

            <button
            onclick="cerrarConfirmacion()">
                Cancelar
            </button>

            <button
            id="btnConfirmar"
            style="
            background:#f44336;">
                Eliminar
            </button>

        </div>

    </div>

</div>
<!-- FIN MODAL CONFIRMACION  -->

<!-- MODAL CANTIDAD -->
 <div id="modalCantidad" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2 id="tituloCantidad">
            Cantidad
        </h2>

        <p id="textoCantidad">
        </p>

        <input
        type="number"
        id="inputCantidad"
        min="1"
        style="
        width:100%;
        padding:10px;
        margin:15px 0;
        border-radius:8px;">

        <div style="
        display:flex;
        gap:10px;
        justify-content:center;">

            <button
            onclick="cerrarCantidad()">
                Cancelar
            </button>

            <button
            id="btnCantidadAceptar">
                Aceptar
            </button>

        </div>

    </div>

</div>
<!-- FIN MODAL CANTIDAD  -->
 

</body>
</html>
