<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<title>Inventario</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/styleModal.css">   
</head>
<body>

<h1>📦 Inventario</h1>

<div id="estadisticas">
    <div id="totalProductos"></div>
    <div id="totalExistencias"></div>
    <div id="ultimaExportacion">
🕒 Última exportación: NUNCA
</div>

</div>

<button
id="btnExportar"
onclick="exportarExcel()"
style="
width:100%;
margin-bottom:15px;
background:#4CAF50;
color:white;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
">
📥 EXPORTAR EXCEL
</button>

<button
onclick="document.getElementById('archivoExcel').click()"
style="
width:100%;
margin-bottom:15px;
background:#705328;
color:white;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
">
📂 IMPORTAR EXCEL
</button>

<input
type="file"
id="archivoExcel"
accept=".xlsx"
style="display:none;"
onchange="importarExcel(event)">

<input id="buscar" placeholder="Buscar producto">

<div id="formularioProducto">

    <input id="codigo" placeholder="Código de barras">

    <input id="nombre" placeholder="Nombre">

    <textarea id="descripcion" placeholder="Descripción"></textarea>

    <input id="cantidad" type="number" placeholder="Cantidad">

    <input id="area" placeholder="Área">

    <button class="guardar" onclick="guardarProducto()">
    💾 Guardar Producto
    </button>

    

    <button class="cancelar" onclick="cerrarFormulario()">
      🔙 Cancelar
    </button>


</div>

<div id="lista"></div>


<button id="btnFlotante" onclick="nuevoProducto()">
+  
</button>

<!-- MODAL -->

<div id="modalAlerta" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h3 id="tituloModal">
            Inventario
        </h3>

        <p id="textoModal"></p>

        <!-- <button
        onclick="cerrarModal()">
            Aceptar
        </button> -->

    </div>

</div>

<!-- FIN MODAL -->

<!-- MODAL HISTORIAL -->
 <div id="modalHistorial" class="modal-alerta">

    <div class="modal-alerta-contenido modal-historial">

        <h2 id="tituloHistorial">
            Historial
        </h2>

        <div id="contenidoHistorial">
        </div>

        <button onclick="cerrarHistorial()">
            Cerrar
        </button>

    </div>

</div>
<!-- FIN MODAL HISTORIAL -->

<!-- MODAL CONFIRMACION -->
 <div id="modalConfirmar" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2 id="tituloConfirmar">
            Confirmar
        </h2>

        <p id="textoConfirmar">
        </p>

        <div style="
        display:flex;
        gap:10px;
        justify-content:center;">

            <button
            onclick="cerrarConfirmacion()">
                Cancelar
            </button>

            <button
            id="btnConfirmar"
            style="
            background:#f44336;">
                Eliminar
            </button>

        </div>

    </div>

</div>
<!-- FIN MODAL CONFIRMACION  -->

<!-- MODAL CANTIDAD -->
 <div id="modalCantidad" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2 id="tituloCantidad">
            Cantidad
        </h2>

        <p id="textoCantidad">
        </p>

        <input
        type="number"
        id="inputCantidad"
        min="1"
        style="
        width:100%;
        padding:10px;
        margin:15px 0;
        border-radius:8px;">

        <div style="
        display:flex;
        gap:10px;
        justify-content:center;">

            <button
            onclick="cerrarCantidad()">
                Cancelar
            </button>

            <button
            id="btnCantidadAceptar">
                Aceptar
            </button>

        </div>

    </div>

</div>
<!-- FIN MODAL CANTIDAD  -->

<!-- modalEditar -->
 <div id="modalEditar" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2 id="tituloEditar">
         ✏️ Editar producto
        </h2>

        <input
        id="editCodigo"
        placeholder="Código">

        <input
        id="editNombre"
        placeholder="Nombre">

        <input
        id="editDescripcion"
        placeholder="Descripción">

        <input
        id="editCantidad"
        type="number"
        placeholder="Cantidad">

        <input
        id="editArea"
        placeholder="Área">

        <div style="
        margin-top:15px;
        display:flex;
        gap:10px;
        justify-content:center;">

            <button
            onclick="cerrarEditar()">
                Cancelar
            </button>

            <button
            onclick="guardarEdicionModal()">
                Guardar
            </button>

        </div>

        <h3 style="margin-top:20px;">- OTRAS OPCIONES -</h3>
        <button
        style="
        width:100%;
        margin-top:10px;
        background:#d32f2f;
        color:white;
        "
        onclick="reiniciarInventario(cerrarEditar())">
        🗑 Reiniciar Inventario
        </button>

    </div>

</div>
<!-- fin modalEditar  -->

<!-- modal exportar -->
 <div id="modalExportar" class="modal-alerta">

    <div class="modal-alerta-contenido">

        <h2>
            📥 Exportar Excel
        </h2>

        <p>
            Nombre del archivo:
        </p>

        <input
        type="text"
        id="nombreExportacion"
        value="Inventario">

        <div style="
        display:flex;
        gap:10px;
        justify-content:center;
        margin-top:15px;">

            <button
            onclick="cerrarExportacion()">
                Cancelar
            </button>

            <button
            onclick="confirmarExportacion()">
                Exportar
            </button>

        </div>

    </div>

</div>
<!-- fin modal exportar -->
 
<!-- JS -->
<script src="js/excel.js"></script>
<script src="js/modal.js"></script>
<script src="js/modalEditar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
